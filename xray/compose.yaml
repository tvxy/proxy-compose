services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    restart: always
    network_mode: "host"
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ./config.json:/etc/xray/config.json
    command: run -c /etc/xray/config.json
